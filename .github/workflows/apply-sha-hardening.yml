name: Export BORE SHA hardened workflow

on:
  push:
    branches:
      - agent/bore-680-sha-hardening-20260728
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: export-bore-sha-hardened-vulcano
  cancel-in-progress: true

jobs:
  export:
    if: github.head_ref == 'agent/bore-680-sha-hardening-20260728' || github.ref_name == 'agent/bore-680-sha-hardening-20260728'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/bore-680-sha-hardening-20260728
          fetch-depth: 0

      - name: Apply workflow hardening
        run: python3 automation/.apply-ci-hardening.py

      - name: Validate workflow hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'patch-source-overrides.json' .github/workflows/push.yml
          grep -Fq 'makepkg --verifysource --skipchecksums' .github/workflows/push.yml
          grep -Fq 'tests/test-bore-overlay.py' .github/workflows/push.yml
          ! grep -Fq '356f9b2935e3ca79c3bcfa87d8630b6fec3fb731049c81cc7086fbbaa58f5e60' .github/workflows/push.yml
          git diff --check -- .github/workflows/push.yml

      - name: Stage exported workflow
        run: |
          mkdir -p exported/.github/workflows
          cp .github/workflows/push.yml exported/.github/workflows/push.yml

      - name: Upload validated workflow
        uses: actions/upload-artifact@v4
        with:
          name: vulcano-validated-workflow-${{ github.sha }}
          path: exported
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
