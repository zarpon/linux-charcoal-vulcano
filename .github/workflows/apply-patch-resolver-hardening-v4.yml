name: Execute Charcoal patch resolver hardening v4

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'agent/patch-resolver-hardening-20260727'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply, test and persist diagnostics
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -u
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          status=0
          {
            set -Eeuo pipefail
            python3 automation/stage-patch-resolver-hardening.py
            python3 -m py_compile automation/resolve-latest-patches.py tests/test-resolve-latest-patches.py
            python3 tests/test-resolve-latest-patches.py
            git diff --check
          } > /tmp/resolver-hardening.log 2>&1 || status=$?
          cat /tmp/resolver-hardening.log
          if ((status != 0)); then
            git reset --hard HEAD
            mkdir -p logs
            cp /tmp/resolver-hardening.log logs/resolver-hardening-debug.log
            git add -f logs/resolver-hardening-debug.log
            git commit -m "ci: record Charcoal resolver hardening failure"
            git push origin "HEAD:$HEAD_BRANCH"
            exit "$status"
          fi
          git add automation/resolve-latest-patches.py tests/test-resolve-latest-patches.py .github/workflows/push.yml
          git commit -m "Harden dynamic local-port tracking"
          git push origin "HEAD:$HEAD_BRANCH"
