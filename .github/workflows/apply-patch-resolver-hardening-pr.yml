name: Execute Charcoal patch resolver hardening

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'agent/patch-resolver-hardening-20260727'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute staged correction
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PYRUN'
          from pathlib import Path

          source = Path('.github/workflows/apply-patch-resolver-hardening.yml').read_text(encoding='utf-8').splitlines()
          start = next(index for index, line in enumerate(source) if line.strip() == "python3 - <<'PY'") + 1
          end = next(index for index in range(start, len(source)) if source[index].strip() == 'PY')
          block = source[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in block if line.strip())
          code = '\n'.join(line[indent:] for line in block) + '\n'
          exec(compile(code, 'staged-charcoal-resolver-hardening.py', 'exec'), {'__name__': '__main__'})
          PYRUN
          python3 -m py_compile automation/resolve-latest-patches.py tests/test-resolve-latest-patches.py
          python3 tests/test-resolve-latest-patches.py
          git diff --check

      - name: Commit correction to validation branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add automation/resolve-latest-patches.py tests/test-resolve-latest-patches.py .github/workflows/push.yml
          git commit -m "Harden dynamic local-port tracking"
          git push origin "HEAD:$HEAD_BRANCH"
