name: Diagnose Charcoal patch resolver hardening

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/patch-resolver-hardening-20260727'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply and test corrections
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -u
          status=0
          {
            set -Eeuo pipefail
            python3 automation/stage-patch-resolver-hardening.py
            python3 -m py_compile automation/resolve-latest-patches.py tests/test-resolve-latest-patches.py
            python3 tests/test-resolve-latest-patches.py
            git diff --check
          } > resolver-hardening-debug.log 2>&1 || status=$?
          cat resolver-hardening-debug.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charcoal-resolver-hardening-debug
          path: resolver-hardening-debug.log
          if-no-files-found: error
          retention-days: 3
      - name: Fail when validation failed
        if: steps.test.outputs.status != '0'
        run: exit 1
