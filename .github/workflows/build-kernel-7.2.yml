name: Build and prerelease SteamOS 7.2 Charcoal kernel

on:
  push:
    branches:
      - kernel-7.2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: charcoal-7.2-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-kernel-7-2:
    if: github.ref == 'refs/heads/kernel-7.2'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out 7.2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Configure 16 GiB swap
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 16

      - name: Validate 7.2 automation locally
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            automation/prepare-steamos-7.2.py \
            automation/prepare-pkgbuild-7.2.py \
            automation/resolve-latest-patches-7.2.py \
            automation/resolve-latest-patches.py \
            tests/test-prepare-steamos-7.2.py \
            tests/test-prepare-pkgbuild-7.2.py \
            tests/test-resolve-latest-patches-7.2.py
          python3 tests/test-prepare-steamos-7.2.py -v
          python3 tests/test-prepare-pkgbuild-7.2.py -v
          python3 tests/test-resolve-latest-patches-7.2.py -v
          python3 tests/test-resolve-latest-patches.py -v
          bash -n install-charcoal.sh
          bash tests/test-install-charcoal.sh

      - name: Resolve official SteamOS 7.2 source and Arch config
        run: |
          set -Eeuo pipefail
          mkdir -p logs
          python3 automation/prepare-pkgbuild-7.2.py --write PKGBUILD
          python3 automation/prepare-steamos-7.2.py \
            --manifest-in automation/patch-sources.json \
            --manifest-out logs/patch-sources-7.2.json \
            --metadata logs/steamos-7.2-source.json \
            --config-out config \
            --fetch-config | tee logs/steamos-7.2-prepare.log
          python3 automation/resolve-latest-patches-7.2.py \
            --manifest logs/patch-sources-7.2.json \
            --overrides automation/patch-source-overrides-7.2.json \
            --write | tee logs/resolver.log
          python3 automation/validate-patch-lock.py \
            --manifest logs/patch-sources-7.2.json \
            --overrides automation/patch-source-overrides-7.2.json \
            --lock logs/patch-lock.json | tee logs/patch-lock-validation.log
          bash -n PKGBUILD

      - name: Validate 7.2 contracts before source download
        run: |
          set -Eeuo pipefail
          grep -Fq 'pkgbase=linux-charcoal-72' PKGBUILD
          grep -Fq '_nepbase=linux-neptune-72' PKGBUILD
          grep -Eq '^_tag=7\.2' PKGBUILD
          grep -Fq 'CONFIG_RTW89_USB=m' config-neptune
          grep -Fq 'CONFIG_ZSWAP_DEFAULT_ON=y' config-neptune
          grep -Fq 'CONFIG_ZRAM_MULTI_COMP=y' config-charcoal
          grep -Fq 'CONFIG_ZRAM_DEF_COMP_LZ4=y' config-charcoal
          grep -Fq 'params->level = -1;' latest-zram-ir.patch
          grep -Fq 'sysctl_zram_recomp_immediate = 1' latest-zram-ir.patch
          python3 - <<'PY'
          import json
          from pathlib import Path

          pkgbuild = Path('PKGBUILD').read_text(encoding='utf-8')
          required_order = [
              'latest-bore.patch',
              'latest-bore-sched-ext-coexistence-fix.patch',
              'latest-poc-selector.patch',
              'latest-adios.patch',
              'latest-adios-default.patch',
          ]
          positions = [pkgbuild.index(name) for name in required_order]
          assert positions == sorted(positions), positions

          lock = json.loads(Path('logs/patch-lock.json').read_text(encoding='utf-8'))
          assert lock['kernel']['version'] == '7.2'
          assert lock['kernel']['tag'].startswith('7.2')
          expected = {
              'lru_marie', 'zram_ir', 'adios', 'bore',
              'bore_sched_ext_coexistence', 'poc_selector', 'nap',
          }
          assert set(lock['components']) == expected
          assert lock['components']['zram_ir']['origin'] == 'local-port'
          assert lock['components']['zram_ir']['path'] == '0001-linux7.2-zram-ir-1.2.patch'
          for native in ('lru_marie', 'bore', 'poc_selector'):
              item = lock['components'][native]
              assert item['origin'] == 'upstream-compatible', (native, item)
              assert item.get('kernel_version', '').startswith('7.2'), (native, item)
          for validated_nearest in ('adios', 'nap'):
              assert lock['components'][validated_nearest]['origin'] == 'upstream-compatible'
          PY

      - name: Build Docker image
        run: docker build . -t charcoal-72 2>&1 | tee logs/docker-build.log

      - name: Fetch, verify and prepare all sources
        run: |
          set -Eeuo pipefail
          restore_owner() {
            sudo chown -R "$(id -u):$(id -g)" "$PWD/logs" "$PWD/.git" "$PWD/.cache" 2>/dev/null || true
            sudo chown "$(id -u):$(id -g)" "$PWD" || true
          }
          trap restore_owner EXIT
          mkdir -p .cache/ccache
          docker run --rm -v "$PWD:/project" charcoal-72 chown -R nobody /project
          docker run --rm -v "$PWD:/project" charcoal-72 sudo -u nobody bash -lc '
            set -Eeuo pipefail
            cd /project
            export CCACHE_DIR=/project/.cache/ccache
            export CCACHE_BASEDIR=/project
            export CCACHE_COMPILERCHECK=content
            export CCACHE_NOHASHDIR=true
            export CCACHE_MAXSIZE=5G
            export CCACHE_COMPRESS=true

            # All source-mutating automation has already run. Generate the final
            # integrity array directly from those exact bytes; never bootstrap by
            # bypassing checksum validation.
            makepkg -g > logs/generated-sha256sums.txt
            python3 automation/finalize-pkgbuild-checksums.py \
              --generated logs/generated-sha256sums.txt \
              --report logs/checksum-validation.txt
            bash -n PKGBUILD

            # Re-generate after finalization and require byte-for-byte stability.
            # This catches source/checksum drift before prepare/compile can start.
            makepkg -g > logs/generated-sha256sums.verify.txt
            if ! cmp -s logs/generated-sha256sums.txt logs/generated-sha256sums.verify.txt; then
              echo "::error::checksum generation is not idempotent; source content changed during finalization"
              diff -u logs/generated-sha256sums.txt logs/generated-sha256sums.verify.txt || true
              exit 1
            fi

            makepkg --verifysource 2>&1 | tee logs/verifysource.log
            makepkg -Cof --noconfirm 2>&1 | tee logs/prepare-7.2.log
          '
          restore_owner
          trap - EXIT

      - name: Compile and package SteamOS 7.2 kernel
        run: |
          set -Eeuo pipefail
          restore_owner() {
            sudo chown -R "$(id -u):$(id -g)" "$PWD/logs" "$PWD/.git" "$PWD/.cache" 2>/dev/null || true
            sudo chown "$(id -u):$(id -g)" "$PWD" || true
          }
          trap restore_owner EXIT
          docker run --rm -v "$PWD:/project" charcoal-72 sudo -u nobody bash -lc '
            set -Eeuo pipefail
            cd /project
            export CCACHE_DIR=/project/.cache/ccache
            export CCACHE_BASEDIR=/project
            export CCACHE_COMPILERCHECK=content
            export CCACHE_NOHASHDIR=true
            export CCACHE_MAXSIZE=5G
            export CCACHE_COMPRESS=true
            ccache --show-stats | tee logs/ccache-before.txt
            makepkg -ef --noconfirm 2>&1 | tee logs/makepkg-7.2.log
            ccache --show-stats | tee logs/ccache-after.txt
          '
          restore_owner
          trap - EXIT
          compgen -G 'linux-charcoal-72-*.pkg.tar.zst' >/dev/null
          sha256sum linux-charcoal-72-*.pkg.tar.zst | tee logs/SHA256SUMS

      - name: Create SteamOS 7.2 prerelease bundle
        run: |
          set -Eeuo pipefail
          PKGVER="$(bash -c 'source PKGBUILD; printf "%s" "$pkgver"')"
          KERNEL_TAG="$(bash -c 'source PKGBUILD; printf "%s" "$_tag"')"
          RELEASE_TAG="charcoal-7.2-${PKGVER}-r${GITHUB_RUN_NUMBER}"
          RELEASE_ZIP="linux-charcoal-72-${PKGVER}-r${GITHUB_RUN_NUMBER}.zip"
          echo "PKGVER=$PKGVER" >> "$GITHUB_ENV"
          echo "KERNEL_TAG=$KERNEL_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_ZIP=$RELEASE_ZIP" >> "$GITHUB_ENV"
          python3 - "$RELEASE_ZIP" <<'PY'
          import hashlib
          import sys
          import zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          packages = sorted(Path('.').glob('linux-charcoal-72-*.pkg.tar.zst'))
          assert len(packages) == 2, [str(path) for path in packages]
          manifest = ''.join(
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n"
              for path in packages
          )
          Path('SHA256SUMS').write_text(manifest, encoding='utf-8')
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED) as handle:
              handle.writestr('SHA256SUMS', manifest)
              for package in packages:
                  handle.write(package, package.name)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path('RELEASE-ZIP-SHA256SUM').write_text(
              f"{digest}  {archive.name}\n", encoding='utf-8'
          )
          PY
          {
            echo "# Charcoal SteamOS 7.2 prerelease"
            echo
            echo "Experimental build from the dedicated \`kernel-7.2\` branch."
            echo
            echo "- Valve kernel tag: \`${KERNEL_TAG}\`"
            echo "- Package version: \`${PKGVER}\`"
            echo "- Workflow run: \`${GITHUB_RUN_NUMBER}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
            echo "This release is intentionally marked as a GitHub prerelease and is not consumed by the stable Charcoal installer."
          } > logs/release-notes.md

      - name: Publish SteamOS 7.2 GitHub prerelease
        run: |
          set -Eeuo pipefail
          assets=(
            "$RELEASE_ZIP"
            RELEASE-ZIP-SHA256SUM
            logs/SHA256SUMS
            logs/patch-lock.json
            logs/steamos-7.2-source.json
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file logs/release-notes.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file logs/release-notes.md \
              --prerelease
          fi

      - name: Upload 7.2 packages and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-charcoal-7.2-${{ github.run_number }}
          path: |
            linux-charcoal-72-*.pkg.tar.zst
            linux-charcoal-72-*.zip
            RELEASE-ZIP-SHA256SUM
            logs
          if-no-files-found: warn
          retention-days: 14
