name: Daily full kernel builds

on:
  schedule:
    # GitHub Actions cron uses UTC. 03:00 UTC = 00:00 America/Sao_Paulo (Brasilia).
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-full-builds:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger master 6.16 full build and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh workflow run push.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f publish_release=true

      - name: Trigger 618pre full build and prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh workflow run push.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref 618pre \
            -f publish_release=true

      - name: Trigger kernel-7.2 full build and Preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh workflow run build-kernel-7.2.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref kernel-7.2
