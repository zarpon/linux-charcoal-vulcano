# Legacy ZRAM compressor profile. The gaming-swap installation policy masks
# ZRAM setup and uses LZ4 zswap with a persistent /home swapfile by default.
# This drop-in overrides SteamOS' primary zstd setting before zram0 is sized.
# With CONFIG_ZRAM_MULTI_COMP, later algorithms become recompressors in priority
# order, so zstd is installed as priority 1 after lz4.
[zram0]
compression-algorithm = lz4 zstd
